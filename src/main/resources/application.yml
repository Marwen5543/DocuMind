spring:
  application:
    name: DocuMind

  datasource:
    url: jdbc:postgresql://localhost:5432/documind_db
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: mistral
      embedding:
        model: nomic-embed-text
