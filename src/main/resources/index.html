<!DOCTYPE html>
<html>
<body>
<h2>DocuMind Upload Test</h2>
<!-- This form forces the Browser to send a POST request -->
<form action="/api/documents" method="POST" enctype="multipart/form-data">
    <label>Select PDF:</label>
    <input type="file" name="file" required accept=".pdf" />
    <br><br>
    <button type="submit">Upload Document</button>
</form>
</body>
</html>
