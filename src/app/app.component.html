<!-- TAILWIND DEBUG BAR -->


<div class="flex h-[calc(100vh-24px)] bg-gray-900 font-sans overflow-hidden">

  <!-- SIDEBAR (Now Midnight Blue) -->
  <aside class="w-72 bg-blue-950 border-r border-blue-900 flex flex-col relative z-20 shadow-2xl">
    
    <!-- Header -->
    <div class="p-6">
      <div class="flex items-center gap-3 mb-8">
        <div class="w-10 h-10 rounded-xl bg-orange-500 flex items-center justify-center shadow-lg shadow-orange-500/20">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
          </svg>
        </div>
        <div>
          <h1 class="text-xl font-bold text-white tracking-tight">DocuMind</h1>
          <span class="text-xs text-orange-400 font-semibold uppercase tracking-wider">Enterprise Edition</span>
        </div>
      </div>

      <!-- Upload Button (Big & Obvious) -->
      <div class="relative group cursor-pointer">
        <input type="file" (change)="onFileSelected($event)" accept=".pdf"
               class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" />
        
        <div class="bg-blue-900/50 border-2 border-dashed border-blue-700 hover:border-orange-500 hover:bg-blue-800 rounded-xl p-6 transition-all duration-300 group-hover:scale-[1.02]">
          <div class="flex flex-col items-center gap-2 text-center">
            <div class="p-3 bg-blue-800 rounded-full text-orange-400 group-hover:text-white transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
              </svg>
            </div>
            <div>
              <p class="font-semibold text-blue-100">Click to Upload PDF</p>
              <p class="text-xs text-blue-400 mt-1">Supports RAG Analysis</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Status (Animated) -->
      <div *ngIf="uploadStatus" class="mt-6 p-4 rounded-lg border text-sm font-medium animate-bounce"
           [ngClass]="uploadStatus.includes('✅') ? 'bg-green-900/30 border-green-500 text-green-400' : 'bg-orange-900/30 border-orange-500 text-orange-400'">
        {{ uploadStatus }}
      </div>
    </div>
  </aside>

  <!-- MAIN CHAT -->
  <main class="flex-1 flex flex-col relative bg-gray-950">
    
    <!-- Top Navigation -->
    <header class="h-16 border-b border-gray-800 flex items-center justify-between px-8 bg-gray-900/50 backdrop-blur">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
        <span class="text-gray-400 text-sm">System Status: <span class="text-white font-mono">ONLINE</span></span>
      </div>
    </header>

    <!-- Chat Area -->
    <div class="flex-1 overflow-y-auto p-8 space-y-6">
      
      <!-- Empty State -->
      <div *ngIf="messages.length === 0" class="flex flex-col items-center justify-center h-full text-gray-600">
        <div class="w-24 h-24 bg-gray-900 rounded-full flex items-center justify-center mb-4 border border-gray-800">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
          </svg>
        </div>
        <p class="text-lg font-medium">No messages yet.</p>
        <p class="text-sm">Upload a document to wake up the AI.</p>
      </div>

      <!-- Messages -->
      <div *ngFor="let msg of messages" class="flex gap-4 max-w-4xl mx-auto" [ngClass]="{'flex-row-reverse': msg.isUser}">
        
        <!-- Avatar -->
        <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0 border-2"
             [ngClass]="msg.isUser ? 'bg-gray-800 border-gray-700' : 'bg-orange-600 border-orange-500'">
          <span *ngIf="msg.isUser" class="text-xs text-white">YOU</span>
          <span *ngIf="!msg.isUser" class="text-white font-bold">AI</span>
        </div>

        <!-- Bubble -->
        <div class="px-6 py-4 rounded-2xl max-w-[80%] text-sm leading-7 shadow-lg"
             [ngClass]="msg.isUser ? 'bg-gray-800 text-white rounded-tr-none' : 'bg-orange-600 text-white rounded-tl-none'">
          {{ msg.text }}
        </div>
      </div>

      <!-- Thinking -->
      <div *ngIf="isThinking" class="flex gap-4 max-w-4xl mx-auto opacity-75">
        <div class="w-10 h-10 bg-orange-600 rounded-full flex items-center justify-center animate-pulse">...</div>
        <div class="bg-gray-800 px-6 py-4 rounded-2xl text-gray-400 text-sm">AI is processing...</div>
      </div>

    </div>

    <!-- Input -->
    <div class="p-6 bg-gray-900 border-t border-gray-800">
      <div class="max-w-4xl mx-auto flex gap-4">
        <input [(ngModel)]="userMessage" (keyup.enter)="sendMessage()" 
               placeholder="Type your question..." 
               class="flex-1 bg-gray-800 text-white border-0 rounded-xl px-6 py-4 focus:ring-2 focus:ring-orange-500 transition-all placeholder-gray-600"/>
        
        <button (click)="sendMessage()" 
                class="bg-orange-500 hover:bg-orange-600 text-white px-8 rounded-xl font-bold transition-transform hover:scale-105 active:scale-95">
          SEND
        </button>
      </div>
    </div>

  </main>
</div>
