name: Frontend CI (Angular)

on:
  push:
    branches: [ "frontend" ]
  pull_request:
    branches: [ "frontend" ]

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
    # 1. Download code
    - uses: actions/checkout@v4

    # 2. Install Node.js
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    # 3. Install Dependencies
    - name: Install Dependencies
      run: npm install

    # 4. Build the App (Checks for Type Errors)
    - name: Build Angular
      run: npm run build -- --configuration production