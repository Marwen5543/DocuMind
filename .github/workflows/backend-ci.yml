name: Backend CI (Java)

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'src/**'       # Only run if Java files change
      - 'pom.xml'      # Or if dependencies change
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
    # 1. Download your code
    - uses: actions/checkout@v4

    # 2. Install Java 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    # 3. Compile the Code
    # We use -DskipTests because we don't have Ollama running in GitHub's cloud
    - name: Build with Maven
      run: mvn -B package -DskipTests --file pom.xml